<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Animated Scene</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: linear-gradient(#001020, #334);
    }

    .moon {
      position: absolute;
      top: 40px;
      left: 80%;
      width: 60px;
      height: 60px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 15px #fff;
    }

    .cloud {
      position: absolute;
      top: 100px;
      left: -150px;
      width: 120px;
      height: 60px;
      background: #ccc;
      border-radius: 50%;
      animation: cloudMove 20s linear infinite;
    }

    @keyframes cloudMove {
      0% { left: -150px; }
      100% { left: 110%; }
    }

    .rain {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .ground {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 40vh;
      background: #2e8b57;
    }

    .grass {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 20px;
      background: #228B22;
    }

    .house {
      position: absolute;
      bottom: 20px;
      left: 100px;
      width: 100px;
      height: 80px;
      background: brown;
      border: 3px solid #5c2e00;
    }

    .woman {
      position: absolute;
      bottom: 20px;
      width: 20px;
      height: 50px;
      background: pink;
      animation: moveWoman 10s linear infinite;
    }

    @keyframes moveWoman {
      0% { left: -30px; }
      100% { left: 100%; }
    }

    .car {
      position: absolute;
      bottom: 20px;
      width: 50px;
      height: 25px;
      background: #333;
      animation: moveCar 8s linear infinite;
    }

    @keyframes moveCar {
      0% { left: 100%; }
      100% { left: -60px; }
    }

    .raindrop {
      position: absolute;
      width: 2px;
      height: 10px;
      background: lightblue;
      opacity: 0.5;
      animation: fall 1s linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(100vh);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="moon"></div>
  <div class="cloud"></div>
  <div class="rain" id="rain"></div>

  <div class="ground">
    <div class="grass"></div>
    <div class="house"></div>
    <div class="woman"></div>
    <div class="car"></div>
  </div>

  <script>
    // Simple rain effect
    const rainContainer = document.getElementById('rain');
    function makeRain() {
      const drop = document.createElement('div');
      drop.className = 'raindrop';
      drop.style.left = Math.random() * window.innerWidth + 'px';
      rainContainer.appendChild(drop);
      setTimeout(() => drop.remove(), 1000);
    }
    setInterval(makeRain, 100);
  </script>
</body>
</html>
